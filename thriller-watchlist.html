<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thriller Week">
<meta name="theme-color" content="#080810">
<title>Thriller Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --surface: #0f0f1c;
  --card: #141424;
  --card2: #1a1a2e;
  --border: #252540;
  --red: #c0392b;
  --red-bright: #e74c3c;
  --red-glow: rgba(192,57,43,0.18);
  --crimson: #8b0000;
  --text: #ede8e0;
  --muted: #6b6b88;
  --faint: #2a2a45;
  --gold: #c8a84b;
  --week-color: #c0392b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  min-height: 100vh;
  font-family: 'Crimson Pro', Georgia, serif;
  color: var(--text);
  overflow-x: hidden;
}

/* scanline atmosphere */
body::before {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.04) 2px,
    rgba(0,0,0,0.04) 4px
  );
  pointer-events: none;
  z-index: 0;
}

/* blood drip top accent */
body::after {
  content: '';
  position: fixed; top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, var(--red) 20%, var(--red-bright) 50%, var(--red) 80%, transparent 100%);
  z-index: 200;
  box-shadow: 0 0 20px var(--red);
}

header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(8,8,16,0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
  padding-top: calc(14px + env(safe-area-inset-top));
}

.header-inner {
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--text);
  line-height: 1;
}

.logo-red { color: var(--red-bright); }

.week-badge {
  background: var(--red);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1.5px;
  padding: 4px 12px;
  border-radius: 3px;
  box-shadow: 0 0 12px var(--red-glow);
}

main {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px 60px;
  position: relative; z-index: 1;
}

/* Week header */
.week-header {
  margin-bottom: 22px;
  animation: fadeSlide 0.5s ease both;
}

.week-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--text);
}

.week-title span { color: var(--red-bright); }

.week-meta {
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
  margin-top: 4px;
}

.week-meta strong { color: var(--gold); font-style: normal; }

/* Progress bar */
.progress-section {
  margin-bottom: 24px;
  animation: fadeSlide 0.5s ease 0.05s both;
}

.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted);
  margin-bottom: 7px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.progress-bar-bg {
  height: 4px;
  background: var(--faint);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--crimson), var(--red-bright));
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 8px var(--red);
}

/* Filter tabs */
.tabs {
  display: flex; gap: 6px;
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
  animation: fadeSlide 0.5s ease 0.08s both;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px; letter-spacing: 1px;
  padding: 5px 14px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.tab.active {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
  box-shadow: 0 0 10px var(--red-glow);
}

/* Cards */
.cards-list { display: flex; flex-direction: column; gap: 10px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  animation: fadeSlide 0.4s ease both;
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
  position: relative;
}

.card:active { transform: scale(0.98); }

.card.watched {
  border-color: var(--red);
  background: #14140c;
}

.card.watched::after {
  content: '✓';
  position: absolute; top: 10px; right: 12px;
  width: 22px; height: 22px;
  background: var(--red);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff;
  font-style: normal;
  font-family: sans-serif;
  display: grid; place-items: center;
}

.card-num {
  width: 46px;
  flex-shrink: 0;
  background: var(--card2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--red);
  border-right: 1px solid var(--border);
}

.card.watched .card-num { color: var(--muted); }

.card-body { padding: 12px 40px 12px 14px; flex: 1; min-width: 0; }

.card-type {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--red-bright);
  margin-bottom: 3px;
  font-style: normal;
}

.card.watched .card-type { color: var(--muted); }

.card-title {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
  margin-bottom: 3px;
  color: var(--text);
}

.card.watched .card-title {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--red);
}

.card-sub {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 6px;
}

.card-footer {
  display: flex; align-items: center; gap: 8px;
}

.platform-tag {
  font-size: 10px;
  letter-spacing: 0.5px;
  background: var(--faint);
  color: var(--muted);
  border-radius: 3px;
  padding: 2px 7px;
  font-style: normal;
}

.card-link {
  font-size: 11px;
  color: var(--red-bright);
  text-decoration: none;
  margin-left: auto;
  font-style: normal;
}

/* Section label */
.section-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--muted);
  margin: 20px 0 10px;
  display: flex; align-items: center; gap: 10px;
}

.section-label::after {
  content: '';
  flex: 1; height: 1px;
  background: var(--border);
}

/* Next week teaser */
.next-week {
  margin-top: 28px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--red);
  border-radius: 6px;
  background: var(--surface);
  animation: fadeSlide 0.5s ease 0.3s both;
}

.next-week-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--red);
  margin-bottom: 6px;
}

.next-week-text {
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
  line-height: 1.5;
}

.next-week-countdown {
  margin-top: 6px;
  font-size: 12px;
  color: var(--faint);
  font-style: normal;
}

.next-week-countdown strong { color: var(--gold); }

/* Reset button */
.reset-btn {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 11px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.2s;
  animation: fadeSlide 0.5s ease 0.35s both;
}

.reset-btn:active { border-color: var(--red); color: var(--red); }

footer {
  text-align: center;
  font-size: 11px;
  color: var(--faint);
  padding: 16px;
  position: relative; z-index: 1;
  font-style: italic;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Delay stagger for cards */
.card:nth-child(1) { animation-delay: 0.10s; }
.card:nth-child(2) { animation-delay: 0.15s; }
.card:nth-child(3) { animation-delay: 0.20s; }
.card:nth-child(4) { animation-delay: 0.25s; }
.card:nth-child(5) { animation-delay: 0.28s; }
.card:nth-child(6) { animation-delay: 0.31s; }
.card:nth-child(7) { animation-delay: 0.34s; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Thriller<span class="logo-red">Week</span></div>
    <div class="week-badge" id="weekBadge">WEEK 00</div>
  </div>
</header>

<main>
  <div class="week-header">
    <div class="week-title" id="weekTitle">WEEK <span id="weekNum">—</span></div>
    <div class="week-meta" id="weekMeta">Laadt...</div>
  </div>

  <div class="progress-section">
    <div class="progress-label">
      <span>Voortgang deze week</span>
      <span id="progressText">0 / 5 bekeken</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="filterCards('all', this)">Alles</button>
    <button class="tab" onclick="filterCards('film', this)">Film</button>
    <button class="tab" onclick="filterCards('serie', this)">Serie</button>
    <button class="tab" onclick="filterCards('doc', this)">Doc</button>
  </div>

  <div class="section-label" id="sectionLabel">Deze week</div>

  <div class="cards-list" id="cardsList"></div>

  <div class="next-week" id="nextWeekBox"></div>

  <button class="reset-btn" onclick="resetWeek()">↺ Reset deze week</button>
</main>

<footer>Made by Rob Borghouts 2026 · Rotatie elke maandag</footer>

<script>
// ─── ALL WEEKS DATA (8 rotation pools) ───────────────────────────────────────
const POOL = [
  // Week A
  [
    { type:'film', title:'No Country for Old Men', year:'2007', platform:'Plex', url:'https://watch.plex.tv', desc:'Genadeloos neo-noir. Cormac McCarthy meesterwerk.' },
    { type:'serie', title:'Mare of Easttown', year:'2021', platform:'YouTube', url:'https://youtube.com', desc:'Bekroonde misdaadserie. Kate Winslet op haar best.' },
    { type:'film', title:'Zodiac', year:'2007', platform:'Plex', url:'https://watch.plex.tv', desc:'Fincher. Echte seriemoordenaar. Obsessieve spanning.' },
    { type:'doc', title:'Making a Murderer', year:'2015', platform:'YouTube', url:'https://youtube.com', desc:'Schudde Amerika op. True crime op zijn indrukwekkendst.' },
    { type:'film', title:'The Conversation', year:'1974', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Coppola\'s paranoïde meesterwerk. Tijdloos.' },
  ],
  // Week B
  [
    { type:'film', title:'Gone Girl', year:'2014', platform:'Plex', url:'https://watch.plex.tv', desc:'Fincher snijdt scherp. Huwelijk als slagveld.' },
    { type:'serie', title:'The Sinner', year:'2017', platform:'YouTube', url:'https://youtube.com', desc:'Waarom deed ze het? Psychologisch meesterwerk.' },
    { type:'film', title:'Prisoners', year:'2013', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Vermiste kinderen. Villeneuve op zijn donkerst.' },
    { type:'doc', title:'The Jinx', year:'2015', platform:'YouTube', url:'https://youtube.com', desc:'Robert Durst. Ongelooflijk slot. Echte spanning.' },
    { type:'film', title:'Chinatown', year:'1974', platform:'Plex', url:'https://watch.plex.tv', desc:'Polanski. De ultieme noir thriller. Noir.' },
  ],
  // Week C
  [
    { type:'film', title:'Se7en', year:'1995', platform:'Plex', url:'https://watch.plex.tv', desc:'Wat zit er in de doos? Klassieke Fincher.' },
    { type:'serie', title:'Mindhunter', year:'2017', platform:'YouTube', url:'https://youtube.com', desc:'FBI-profielers interviewen seriemoordenaars. Griezelig goed.' },
    { type:'film', title:'Nightcrawler', year:'2014', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Jake Gyllenhaal als sinistere nieuwsjager. Ongemakkelijk.' },
    { type:'doc', title:'Evil Genius', year:'2018', platform:'YouTube', url:'https://youtube.com', desc:'Bizarre bankroof. Echte true crime chaos.' },
    { type:'film', title:'Parasite', year:'2019', platform:'Plex', url:'https://watch.plex.tv', desc:'Bong Joon-ho. Klasse-spanning. Oscarwinnaar.' },
  ],
  // Week D
  [
    { type:'film', title:'Rear Window', year:'1954', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Hitchcock\'s meesterwerk. Spanning vanuit één kamer.' },
    { type:'serie', title:'Sharp Objects', year:'2018', platform:'YouTube', url:'https://youtube.com', desc:'Amy Adams. Gothisch Missouri. Duistere familiegeheimen.' },
    { type:'film', title:'Heat', year:'1995', platform:'Plex', url:'https://watch.plex.tv', desc:'De Niro vs Pacino. Hectische LA-thriller.' },
    { type:'doc', title:'The Staircase', year:'2004', platform:'YouTube', url:'https://youtube.com', desc:'Heeft hij haar gedood? 18 jaar in zes afleveringen.' },
    { type:'film', title:'Sicario', year:'2015', platform:'Plex', url:'https://watch.plex.tv', desc:'Villeneuve. Drugs. Grens. Onbarmhartig goed.' },
  ],
  // Week E
  [
    { type:'film', title:'The Silence of the Lambs', year:'1991', platform:'Plex', url:'https://watch.plex.tv', desc:'Lecter vs Starling. Ooit geëvenaard? Nooit.' },
    { type:'serie', title:'Broadchurch', year:'2013', platform:'YouTube', url:'https://youtube.com', desc:'Brits. Kustdorp. Moord. Geweldig karakterwerk.' },
    { type:'film', title:'Memento', year:'2000', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Nolan. Achterwaarts verteld. Je hoofd tolt.' },
    { type:'doc', title:'Wild Wild Country', year:'2018', platform:'YouTube', url:'https://youtube.com', desc:'Rajneesh-sekte. Giftaanslag. Absolute werkelijkheid.' },
    { type:'film', title:'Oldboy', year:'2003', platform:'Plex', url:'https://watch.plex.tv', desc:'Park Chan-wook. Koreaanse revenge-thriller. Slag in je gezicht.' },
  ],
  // Week F
  [
    { type:'film', title:'Mystic River', year:'2003', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Eastwood. Penn en Bacon. Verwoestend drama.' },
    { type:'serie', title:'True Detective S1', year:'2014', platform:'YouTube', url:'https://youtube.com', desc:'McConaughey en Harrelson. Louisiana noir. Perfecte tv.' },
    { type:'film', title:'Knives Out', year:'2019', platform:'Plex', url:'https://watch.plex.tv', desc:'Rian Johnson. Whodunnit met twist. Heerlijk.' },
    { type:'doc', title:'Don\'t F**k with Cats', year:'2019', platform:'YouTube', url:'https://youtube.com', desc:'Internetdetectives jagen seriemoordenaar. Snelle true crime.' },
    { type:'film', title:'Uncut Gems', year:'2019', platform:'Plex', url:'https://watch.plex.tv', desc:'Sandler. Spanning die je adem afsnijdt. Non-stop.' },
  ],
  // Week G
  [
    { type:'film', title:'Mulholland Drive', year:'2001', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Lynch. Hollywood droom wordt nachtmerrie. Geen antwoorden.' },
    { type:'serie', title:'Ozark', year:'2017', platform:'YouTube', url:'https://youtube.com', desc:'Bateman speelt geld-witter voor kartel. Alles op het spel.' },
    { type:'film', title:'Blue Ruin', year:'2013', platform:'Plex', url:'https://watch.plex.tv', desc:'Indie-wraakthriller. Geweld als gevolg. Ruw en echt.' },
    { type:'doc', title:'Amanda Knox', year:'2016', platform:'YouTube', url:'https://youtube.com', desc:'Italiaanse moordrechtszaak. Mediaobsessie. Genuanceerd.' },
    { type:'film', title:'A Simple Plan', year:'1998', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Geld gevonden in neergestort vliegtuig. Raimi-thriller.' },
  ],
  // Week H
  [
    { type:'film', title:'Cure', year:'1997', platform:'YouTube', url:'https://youtube.com', desc:'Japanse politiethriller. Hypnose. Onheilspellend.' },
    { type:'serie', title:'Bloodline', year:'2015', platform:'YouTube', url:'https://youtube.com', desc:'Florida Keys. Familieschulden. Slow burn met kracht.' },
    { type:'film', title:'Three Billboards', year:'2017', platform:'Plex', url:'https://watch.plex.tv', desc:'McDormand. Wraak. Morele grijszone. Briljant.' },
    { type:'doc', title:'Icarus', year:'2017', platform:'YouTube', url:'https://youtube.com', desc:'Fietsen en doping worden staatsgeheim. Oscar-winnaar.' },
    { type:'film', title:'Hereditary', year:'2018', platform:'Rakuten TV', url:'https://rakuten.tv', desc:'Ari Aster. Familie-horror-thriller. Nooit vergeten.' },
  ],
];

// ─── UTILS ────────────────────────────────────────────────────────────────────
function getWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
}

function getMondayOf(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0) ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return date;
}

function getNextMonday(d) {
  const m = getMondayOf(d);
  m.setDate(m.getDate() + 7);
  return m;
}

function daysUntilMonday(d) {
  const now = new Date(d);
  const next = getNextMonday(now);
  const diff = Math.ceil((next - now) / 86400000);
  return diff;
}

function formatDate(d) {
  return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
}

// ─── STATE ────────────────────────────────────────────────────────────────────
const now = new Date();
const weekNum = getWeekNumber(now);
const poolIndex = weekNum % POOL.length;
const weekTitles = POOL[poolIndex];
const storageKey = `thriller_watched_w${weekNum}`;

let watched = JSON.parse(localStorage.getItem(storageKey) || '[]');
let activeFilter = 'all';

// ─── RENDER ───────────────────────────────────────────────────────────────────
function saveWatched() {
  localStorage.setItem(storageKey, JSON.stringify(watched));
}

function toggleWatched(idx) {
  if (watched.includes(idx)) {
    watched = watched.filter(i => i !== idx);
  } else {
    watched.push(idx);
  }
  saveWatched();
  updateProgress();
  renderCards();
}

function updateProgress() {
  const total = weekTitles.length;
  const done = watched.length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${total} bekeken`;
}

function filterCards(type, btn) {
  activeFilter = type;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function renderCards() {
  const list = document.getElementById('cardsList');
  const filtered = weekTitles
    .map((t, i) => ({ ...t, idx: i }))
    .filter(t => activeFilter === 'all' || t.type === activeFilter);

  list.innerHTML = filtered.map((t, pos) => {
    const isWatched = watched.includes(t.idx);
    return `
    <div class="card ${isWatched ? 'watched' : ''}" onclick="toggleWatched(${t.idx})">
      <div class="card-num">${String(pos + 1).padStart(2, '0')}</div>
      <div class="card-body">
        <div class="card-type">${t.type === 'film' ? '🎬 Film' : t.type === 'serie' ? '📺 Serie' : '🎥 Documentaire'}</div>
        <div class="card-title">${t.title}</div>
        <div class="card-sub">${t.year} · ${isWatched ? '<em style="color:var(--red)">Bekeken ✓</em>' : t.desc}</div>
        <div class="card-footer">
          <span class="platform-tag">${t.platform}</span>
          <a class="card-link" href="${t.url}" target="_blank" onclick="event.stopPropagation()">Bekijk →</a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function resetWeek() {
  if (confirm('Reset alle vinkjes voor deze week?')) {
    watched = [];
    saveWatched();
    updateProgress();
    renderCards();
  }
}

function renderNextWeek() {
  const nextPool = POOL[(weekNum + 1) % POOL.length];
  const nextTitles = nextPool.slice(0, 3).map(t => `<em>${t.title}</em>`).join(', ');
  const days = daysUntilMonday(now);
  const nextMon = getNextMonday(now);

  document.getElementById('nextWeekBox').innerHTML = `
    <div class="next-week-label">▸ Volgende week</div>
    <div class="next-week-text">Maandag ${formatDate(nextMon)} roteert de lijst automatisch.<br>
    Teaser: ${nextTitles} en meer.</div>
    <div class="next-week-countdown">Nieuwe titels over <strong>${days} dag${days !== 1 ? 'en' : ''}</strong></div>
  `;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('weekNum').textContent = weekNum;
document.getElementById('weekBadge').textContent = `WEEK ${weekNum}`;

const monday = getMondayOf(now);
